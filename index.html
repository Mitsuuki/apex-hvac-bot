<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Home Services - Live Prototype</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin: 0; padding: 20px; display: flex; height: 100vh; box-sizing: border-box; }
        .glass-house { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px; }
        h1 { color: #1f2937; margin-bottom: 5px; }
        .subtitle { color: #6b7280; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
        iframe { width: 100%; height: 400px; border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); background: white; }
        
        /* Premium Custom Chat Widget */
        .chat-container { width: 400px; background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; overflow: hidden; margin-left: 20px; border: 1px solid #e5e7eb; }
        .chat-header { background: #2563eb; color: white; padding: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .chat-header .dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f9fafb; height: 400px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg.bot { background: white; align-self: flex-start; border: 1px solid #e5e7eb; border-bottom-left-radius: 2px; }
        .msg.user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; transition: border 0.2s; }
        input[type="text"]:focus { border-color: #2563eb; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        
        /* Dynamic Quick Reply Buttons */
        .btn-container { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; margin-top: 5px; }
        .quick-reply { background: white; border: 1px solid #2563eb; color: #2563eb; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .quick-reply:hover { background: #eff6ff; }
    </style>
</head>
<body>

    <!-- Left Side: The Backend Proof (Glass House) -->
    <div class="glass-house">
        <div>
            <h1>🛠️ Apex Home Services</h1>
            <p class="subtitle">Live Backend Dashboard (Google Calendar & CRM Sync)</p>
        </div>
        <!-- Replace with your actual public Google Calendar Embed -->
        <iframe src="https://calendar.google.com/calendar/embed?src=sakuramisakikawaii%40gmail.com&ctz=Asia%2FManila"></iframe>
        
        <!-- Replace with your actual published Google Sheet Embed -->
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTXYZ/pubhtml?widget=true&amp;headers=false"></iframe>
    </div>

    <!-- Right Side: The Premium Chat Widget -->
    <div class="chat-container">
        <div class="chat-header">
            <div class="dot"></div> Apex AI Dispatcher
        </div>
        <div class="chat-box" id="chat-box">
            <div class="msg bot">Hi there! Need an AC repair or plumbing fix? Let me know how I can help.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // --- PASTE YOUR N8N WEBHOOK URL HERE ---
        const N8N_WEBHOOK_URL = "http://localhost:5678/webhook/apex-web-chatE"; 
        
        const sessionId = "session_" + Math.floor(Math.random() * 1000000000);
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function appendMessage(text, sender) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendButtons(buttonsArray) {
            if (!buttonsArray || buttonsArray.length === 0) return;
            const container = document.createElement("div");
            container.className = "btn-container";
            
            buttonsArray.forEach(btnText => {
                const btn = document.createElement("button");
                btn.className = "quick-reply";
                btn.innerText = btnText;
                btn.onclick = () => {
                    container.style.display = "none";
                    userInput.value = "I want to book " + btnText;
                    sendMessage();
                };
                container.appendChild(btn);
            });
            chatBox.appendChild(container);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerText = "...";

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ sessionId: sessionId, message: text })
                });

                const data = await response.json();
                
                appendMessage(data.text || "Sorry, I encountered an error.", "bot");
                if (data.buttons) {
                    appendButtons(data.buttons);
                }

            } catch (error) {
                appendMessage("System offline. Could not connect to backend.", "bot");
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = "Send";
                userInput.focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
